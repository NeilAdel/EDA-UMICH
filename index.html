<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Michigan Gasoline Price Expectations — EDA</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--ink:#172033;--muted:#667085;--line:#d9e0e8;--bg:#f5f7fa;--card:#fff;--accent:#2457a7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:#102747;color:#fff;padding:34px clamp(18px,4vw,64px)}header h1{margin:0 0 8px;font-size:clamp(27px,3vw,42px)}header p{margin:0;color:#d6e2f2}.wrap{width:100%;max-width:1800px;margin:auto;padding:24px clamp(12px,2.4vw,38px) 60px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:22px 0;padding:24px clamp(12px,2vw,30px);box-shadow:0 2px 9px #1027470a}
h2{font-size:25px;margin:0 0 6px}h3{font-size:20px;margin:24px 0 8px}.desc{color:var(--muted);margin:0 0 14px}.plot{width:100%;height:640px}.plot.tall{height:850px}.plot.hist{height:1250px}.table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:620px}table{width:100%;border-collapse:collapse;min-width:780px;font-size:14px}th,td{padding:9px 11px;border-bottom:1px solid #e8edf2;text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#edf2f8;z-index:1;color:#23334b}th:first-child,td:first-child{text-align:left}tr:nth-child(even){background:#fafbfd}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}.controls select{min-width:260px;min-height:150px;padding:8px;border:1px solid #b9c5d3;border-radius:8px;background:white}.btn{border:1px solid #b9c5d3;background:#fff;border-radius:7px;padding:8px 12px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}.stat{background:#f2f6fb;border:1px solid #dce6f1;border-radius:9px;padding:14px}.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:13px}.note{background:#fff8e8;border-left:4px solid #d99b21;padding:12px 15px;color:#5e4b21;border-radius:4px}.loading{padding:40px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:24px}
@media(max-width:700px){.plot{height:500px}.plot.tall{height:700px}.plot.hist{height:1000px}section{padding:16px 10px}}
</style></head><body>
<header><h1>Michigan Gasoline Price Expectations</h1><p>Exploratory data analysis · Survey waves 1978–2026 · Based on the supplied Michigan Survey of Consumers microdata</p></header>
<div class="wrap" id="app"><div class="loading">Loading dashboard data…</div></div><footer>Interactive replication of the supplied EDA notebook. Magnitude variables exclude special missing-value codes.</footer>
<script>
const COLORS={'Go up':'#2878b5','Stay the same':'#2ca25f','Go down':'#d95f59',"Don't know":'#8c78b5','Refused':'#9aa3ad'};
const fmt=n=>Number(n).toLocaleString('en-US');
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v===null||v===undefined?'—':v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function section(id,title,desc=''){return `<section><h2>${title}</h2>${desc?`<p class="desc">${desc}</p>`:''}<div id="${id}" class="plot"></div></section>`}
function lineTraces(records,keys){return keys.map(k=>({type:'scatter',mode:'lines',name:k,x:records.map(r=>r.date),y:records.map(r=>r.values[k]??null),line:{width:2.5,color:COLORS[k]},connectgaps:false,hovertemplate:'%{x|%b %Y}<br>'+k+': %{y:.1f}%<extra></extra>'}))}
function baseLayout(title,ytitle){return {title:{text:title,font:{size:22}},autosize:true,paper_bgcolor:'#fff',plot_bgcolor:'#fff',font:{size:14},margin:{l:75,r:35,t:75,b:85},hovermode:'x unified',xaxis:{title:'Survey month',rangeslider:{visible:true},rangeselector:{buttons:[{count:1,label:'1Y',step:'year',stepmode:'backward'},{count:5,label:'5Y',step:'year',stepmode:'backward'},{count:10,label:'10Y',step:'year',stepmode:'backward'},{step:'all',label:'All'}]}},yaxis:{title:ytitle,gridcolor:'#e8edf2'},legend:{orientation:'h',y:-.22}}}
async function main(){
 const data=await (await fetch('./data.json')).json(); const app=document.getElementById('app');
 app.innerHTML=`<div class="stats"><div class="stat"><b>${fmt(data.meta.observations)}</b><span>Original observations</span></div><div class="stat"><b>${fmt(data.meta.filtered_observations)}</b><span>Rows with at least one A20/A20b response</span></div><div class="stat"><b>${data.meta.start_year}–${data.meta.end_year}</b><span>Coverage in supplied file</span></div><div class="stat"><b>${data.wave_availability.length}</b><span>Monthly waves in file</span></div></div>
 <section><h2>1. Data overview</h2><p class="desc">Descriptive overview of the six variables used in the notebook.</p>${table(['Variable','Data type','Non-missing','Missing','Missing (%)','Unique values','Min','Max'],data.overview.map(r=>[r.Variable,r['Data type'],fmt(r['Non-missing']),fmt(r.Missing),r['Missing (%)'],fmt(r['Unique values']),r.min,r.max]))}</section>
 <section><h2>2. Waves with both gasoline expectation questions</h2><p class="desc">Monthly waves where both direction questions have at least one non-empty response.</p>${table(['YYYYMM','Total observations','A20 non-empty','A20b non-empty','At least one available','Both available'],data.full_waves.map(r=>[r.YYYYMM,fmt(r.total_observations),fmt(r.GASPX1_nonempty),fmt(r.GAS1PX1_nonempty),r.atleast_one_available,r.both_available]))}</section>
 ${section('availability','3. Availability of gasoline expectation questions','Monthly number of non-empty responses for A20 (GASPX1) and A20b (GAS1PX1). Use the range slider to zoom into periods.')}
 <section><h2>4. Monthly availability and sample sizes</h2><p class="desc">Transposed monthly availability table from the notebook: N, A20, A20a, A20b and A20c.</p><div id="monthly-table"></div></section>
 ${section('a20-monthly','5. A20: Five-year gasoline price expectations','Monthly response shares (%), with the notebook’s 1Y/5Y/10Y/all range selector.')}
 ${section('a20b-monthly','6. A20b: Twelve-month gasoline price expectations','Monthly response shares (%), with the notebook’s 1Y/5Y/10Y/all range selector.')}
 ${section('a20-annual','7. A20: Annual five-year expectations','Annual stacked response shares; only valid response codes 1, 3, 5, 8 and 9 are included.')}
 ${section('a20b-annual','8. A20b: Annual twelve-month expectations','Annual stacked response shares; only valid response codes 1, 3, 5, 8 and 9 are included.')}
 ${section('a20a-trend','9. A20a: Five-year expected price change','Monthly mean and median expected change (cents per gallon).')}
 ${section('a20c-trend','10. A20c: Twelve-month expected price change','Monthly mean and median expected change (cents per gallon).')}
 <section><h2>11. Questionnaire routing checks</h2><p class="desc">Eligible respondents are those selecting “Go up” (1) or “Go down” (5). Magnitude follow-ups are assessed against this eligibility definition.</p><div id="routing"></div><p class="note">The notebook used string comparisons for eligibility after converting direction variables to numeric. This website uses numeric codes 1 and 5 so the intended routing check is actually evaluated.</p></section>
 <section><h2>13. Annual categorical distributions — A20 and A20b</h2><p class="desc">Annual shares of respondents selecting each categorical answer. These replace continuous-variable histograms because A20 and A20b are categorical direction questions.</p><div id="a20-annual-cat" class="plot"></div><div id="a20b-annual-cat" class="plot"></div></section>
 <section><h2>14. Monthly wave categorical comparison — A20 and A20b</h2><p class="desc">Select monthly survey waves (YYYYMM) to compare categorical response distributions. Both questions update together. Bars show the percentage choosing each response category in each selected wave; KDE is not appropriate for categorical responses.</p><div class="controls"><label for="waves"><b>Select monthly waves (Ctrl/Cmd-click for multiple):</b></label><select id="waves" multiple></select><button class="btn" id="recent-waves">Select latest 4 waves</button><button class="btn" id="all-waves">Select all waves</button><button class="btn" id="clear-waves">Clear</button></div><div id="a20-wave-cat" class="plot"></div><div id="a20b-wave-cat" class="plot"></div></section>`;
 // availability chart
 Plotly.newPlot('availability',[{x:data.wave_availability.map(r=>String(r.YYYYMM)),y:data.wave_availability.map(r=>r.GASPX1_nonempty),type:'scatter',mode:'lines+markers',name:'GASPX1',line:{width:2.5},marker:{size:4}},{x:data.wave_availability.map(r=>String(r.YYYYMM)),y:data.wave_availability.map(r=>r.GAS1PX1_nonempty),type:'scatter',mode:'lines+markers',name:'GAS1PX1',line:{width:2.5},marker:{size:4}}],{...baseLayout('Availability of Gasoline Expectation Questions','Number of non-empty responses'),xaxis:{...baseLayout('','').xaxis,type:'category',tickangle:45}}, {responsive:true});
 // monthly availability transposed: notebook display(monthly_availability.T)
 const m=data.monthly_availability; document.getElementById('monthly-table').innerHTML=table(['Measure',...m.map(r=>r.YYYYMM)],['N','A20','A20a','A20b','A20c'].map(k=>[k,...m.map(r=>fmt(r[k]))]));
 for(const [id,key,title] of [['a20-monthly','GASPX1','A20: Five-Year Gasoline Price Expectations'],['a20b-monthly','GAS1PX1','A20b: Twelve-Month Gasoline Price Expectations']]) Plotly.newPlot(id,lineTraces(data.monthly_shares[key],Object.keys(COLORS)),{...baseLayout(title,'Share of respondents (%)'),yaxis:{title:'Share of respondents (%)',range:[0,100],gridcolor:'#e8edf2'}},{responsive:true});
 function annualPlot(id,key,title){let rows=data.annual_shares[key],yrs=rows.map(r=>r.year),tr=Object.keys(COLORS).map(label=>({type:'bar',name:label,x:yrs,y:rows.map(r=>r.values[label]??0),marker:{color:COLORS[label]},hovertemplate:'Year %{x}<br>'+label+': %{y:.1f}%<extra></extra>'}));Plotly.newPlot(id,tr,{title:{text:title,font:{size:22}},barmode:'stack',autosize:true,margin:{l:75,r:35,t:75,b:75},xaxis:{title:'Year',dtick:1,tickangle:45},yaxis:{title:'Share of respondents (%)',range:[0,100]},legend:{orientation:'h',y:-.25},hovermode:'x unified'},{responsive:true})}
 annualPlot('a20-annual','GASPX1','A20: Five-Year Gasoline Price Expectations');annualPlot('a20b-annual','GAS1PX1','A20b: Twelve-Month Gasoline Price Expectations');
 for(const [id,idx] of [['a20a-trend',0],['a20c-trend',1]]){let s=data.magnitude[idx];Plotly.newPlot(id,[{x:s.data.map(r=>r.date),y:s.data.map(r=>r.mean),type:'scatter',mode:'lines',name:'Mean',line:{width:2.5}},{x:s.data.map(r=>r.date),y:s.data.map(r=>r.median),type:'scatter',mode:'lines',name:'Median',line:{width:2.5}}],baseLayout(s.title,'Expected change (cents per gallon)'),{responsive:true})}
 document.getElementById('routing').innerHTML=table(['Period','Direction question','Magnitude follow-up','Eligible','Eligible with magnitude','Eligible without magnitude','Non-eligible with magnitude'],data.routing.map(r=>[r.period,r.direction_variable,r.magnitude_variable,fmt(r.eligible),fmt(r.eligible_with_magnitude),fmt(r.eligible_without_magnitude),fmt(r.noneligible_with_magnitude)]));

 const responseOrder=['Go up','Stay the same','Go down',"Don't know",'Refused'];
 function annualCategorical(id,key,title){
   const rows=data.annual_shares[key];
   const traces=responseOrder.map(label=>({type:'bar',name:label,x:rows.map(r=>r.year),y:rows.map(r=>r.values[label]??0),marker:{color:COLORS[label]},hovertemplate:'Year %{x}<br>'+label+': %{y:.1f}%<extra></extra>'}));
   Plotly.newPlot(id,traces,{title:{text:title,font:{size:25}},barmode:'stack',autosize:true,height:680,margin:{l:85,r:35,t:85,b:90},xaxis:{title:'Survey year',dtick:1,tickangle:45},yaxis:{title:'Share of respondents (%)',range:[0,100],gridcolor:'#e8edf2'},legend:{orientation:'h',y:-.22},hovermode:'x unified'},{responsive:true});
 }
 annualCategorical('a20-annual-cat','GASPX1','A20: Five-year expected gasoline price direction');
 annualCategorical('a20b-annual-cat','GAS1PX1','A20b: Twelve-month expected gasoline price direction');
 const sel=document.getElementById('waves');
 const waveRows=data.monthly_shares.GASPX1;
 const waveSet=waveRows.map(r=>Number(r.date.slice(0,4)+r.date.slice(5,7)));
 waveSet.forEach(w=>{let o=document.createElement('option');o.value=w;o.textContent=String(w).slice(0,4)+'-'+String(w).slice(4,6);sel.appendChild(o)});
 function monthlyCategorical(id,key,title,selected){
   const rows=data.monthly_shares[key],byWave=new Map(rows.map(r=>[Number(r.date.slice(0,4)+r.date.slice(5,7)),r.values]));
   const traces=selected.map(w=>({type:'bar',name:String(w).slice(0,4)+'-'+String(w).slice(4,6),x:responseOrder,y:responseOrder.map(label=>byWave.get(w)?.[label]??0),hovertemplate:'Response: %{x}<br>Share: %{y:.1f}%<extra>'+w+'</extra>'}));
   Plotly.react(id,traces,{title:{text:title,font:{size:25}},barmode:'group',autosize:true,height:650,margin:{l:85,r:35,t:85,b:100},xaxis:{title:'Response category'},yaxis:{title:'Share of respondents (%)',range:[0,100],gridcolor:'#e8edf2'},legend:{orientation:'h',y:-.25},hovermode:'x unified',annotations:selected.length===0?[{text:'Select one or more monthly waves above',xref:'paper',yref:'paper',x:.5,y:.5,showarrow:false,font:{size:16}}]:[]},{responsive:true});
 }
 function updateCategorical(){const selected=[...sel.selectedOptions].map(o=>Number(o.value));monthlyCategorical('a20-wave-cat','GASPX1','A20: Five-year expectations by monthly wave',selected);monthlyCategorical('a20b-wave-cat','GAS1PX1','A20b: Twelve-month expectations by monthly wave',selected);}
 function setWaves(arr){[...sel.options].forEach(o=>o.selected=arr.includes(Number(o.value)));updateCategorical()}
 document.getElementById('recent-waves').onclick=()=>setWaves(waveSet.slice(-4));
 document.getElementById('all-waves').onclick=()=>setWaves(waveSet);
 document.getElementById('clear-waves').onclick=()=>setWaves([]);
 sel.onchange=updateCategorical;
 setWaves(waveSet.slice(-4));
 // resize plotly charts after responsive layout settles
 window.addEventListener('resize',()=>document.querySelectorAll('.js-plotly-plot').forEach(p=>Plotly.Plots.resize(p)));
}
main().catch(e=>{document.getElementById('app').innerHTML='<section><h2>Dashboard data could not be loaded</h2><p>'+e.message+'</p><p>Check that data.json is in the same repository root as index.html.</p></section>';console.error(e)});
</script></body></html>
